# nginx 样例配置
# 把 dist/ 传到服务器后，改 root 指向该目录，重载 nginx 即可。
#
# 关键点：/pagefind/ 下的文件是搜索索引，需要允许跨目录读取；
# 其余静态资源长缓存，HTML 不缓存，这样改文章后立刻生效。

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # 证书配好之后放开这一段，把 80 跳转到 443
    # return 301 https://$host$request_uri;

    root /var/www/sprlet-site;
    index index.html;
    charset utf-8;

    # 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # 静态资源长缓存（文件名带 hash，内容变了名字就变）
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /pagefind/ {
        expires 7d;
        add_header Cache-Control "public";
        # pagefind 的索引是分片的，允许范围请求
        add_header Accept-Ranges bytes;
    }

    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # HTML 不缓存，保证发布后立刻是新的
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Astro 默认输出目录式路由：/blog/foo/ -> /blog/foo/index.html
    location / {
        try_files $uri $uri/index.html $uri.html $uri/ =404;
    }

    # 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

